<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>darkcyber</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-overlay: rgba(0, 0, 0, 0.55);
      --card-bg: rgba(20, 20, 25, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f5f5f7;
      --text-secondary: #a1a1aa;
      --accent: #8b5cf6;
      --accent-soft: rgba(139, 92, 246, 0.25);
      --glow: 0 0 40px rgba(139, 92, 246, 0.15);
      --online: #22c55e;
      --idle: #eab308;
      --dnd: #ef4444;
      --offline: #6b7280;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #000;
      color: var(--text-primary);
    }

    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      filter: brightness(0.7) contrast(1.1);
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.4) 70%, rgba(0,0,0,0.75) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }

    .profile-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 2.5rem 2rem 2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: var(--glow), 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: fadeUp 0.8s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar-wrapper {
      position: relative;
      width: 96px;
      height: 96px;
      margin: 0 auto 1.25rem;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.2);
      background: #1a1a2e;
    }

    .status-dot {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 18px;
      height: 18px;
      background: var(--offline);
      border: 3px solid #1a1a1f;
      border-radius: 50%;
      transition: background 0.3s ease;
    }

    .status-dot.online { background: var(--online); box-shadow: 0 0 8px var(--online); }
    .status-dot.idle { background: var(--idle); box-shadow: 0 0 8px var(--idle); }
    .status-dot.dnd { background: var(--dnd); box-shadow: 0 0 8px var(--dnd); }
    .status-dot.offline { background: var(--offline); }

    .username {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.35rem;
      background: linear-gradient(135deg, #fff 0%, #d4d4d8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .bio {
      font-size: 0.95rem;
      color: var(--text-secondary);
      font-weight: 400;
      margin-bottom: 1.5rem;
      line-height: 1.4;
    }

    .tags {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
      flex-wrap: wrap;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .tag.mc {
      background: var(--accent-soft);
      border-color: rgba(139, 92, 246, 0.3);
      color: #c4b5fd;
    }

    .tag.status-text {
      text-transform: capitalize;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
    }

    .social-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      color: var(--text-primary);
      text-decoration: none;
      transition: all 0.25s ease;
      font-size: 1.15rem;
    }

    .social-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.18);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .player {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 0.9rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .player-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 0.9rem;
    }

    .player-info {
      flex: 1;
      min-width: 0;
      text-align: left;
    }

    .track-title {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-time {
      font-size: 0.7rem;
      color: var(--text-secondary);
      margin-top: 0.15rem;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 0.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
      font-size: 0.95rem;
    }

    .ctrl-btn:hover { color: var(--text-primary); }

    .ctrl-btn.play {
      width: 32px;
      height: 32px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      color: var(--text-primary);
    }

    .views {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }

    .mute-btn {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 10;
      width: 44px;
      height: 44px;
      background: rgba(20, 20, 25, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      font-size: 1.1rem;
    }

    .mute-btn:hover {
      background: rgba(40, 40, 50, 0.85);
      transform: scale(1.05);
    }

    .particle {
      position: fixed;
      width: 3px;
      height: 3px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      animation: float linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    @media (max-width: 480px) {
      .profile-card {
        padding: 2rem 1.25rem 1.5rem;
        border-radius: 20px;
      }
      .username { font-size: 1.5rem; }
      .avatar-wrapper { width: 84px; height: 84px; }
    }
  </style>
</head>
<body>
  <video class="bg-video" autoplay muted loop playsinline id="bgVideo">
    <source src="bg.mp4" type="video/mp4" />
  </video>

  <div class="overlay"></div>
  <div id="particles"></div>

  <div class="container">
    <div class="profile-card">
      <div class="avatar-wrapper">
        <!-- GitHub avatar -->
        <img 
          class="avatar" 
          src="https://github.com/X3SM.png" 
          alt="Avatar"
          id="avatarImg"
        />
        <div class="status-dot offline" id="statusDot"></div>
      </div>

      <h1 class="username">darkcyber</h1>
      <p class="bio">Ahhhh, i want PS5</p>

      <div class="tags">
        <span class="tag mc">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          MC
        </span>
        <span class="tag status-text" id="statusText">offline</span>
      </div>

      <div class="socials">
        <a href="#" class="social-btn" title="YouTube" aria-label="YouTube">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        </a>
        <a href="#" class="social-btn" title="TikTok" aria-label="TikTok">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
        </a>
        <a href="https://discord.com/users/799448812254396427" class="social-btn" title="Discord" aria-label="Discord" target="_blank" rel="noopener">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
        </a>
        <a href="#" class="social-btn" title="Steam" aria-label="Steam">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M11.979 0C5.678 0 .511 4.86.022 11.19c.94-1.577 2.74-2.627 4.82-2.627 1.75 0 3.27.83 4.24 2.09.24-.04.49-.07.74-.07 3.18 0 5.76 2.58 5.76 5.76 0 .4-.04.79-.12 1.17 2.54-.7 4.4-3.02 4.4-5.75C19.86 5.14 16.25 1.53 11.98 1.53zm-3.66 13.72c-1.02.5-2.24.24-2.88-.63-.64-.87-.5-2.09.32-2.78.82-.69 2.02-.69 2.78.06.76.75.76 1.95.02 2.8-.12.13-.25.25-.4.35l.16.2zm7.33-1.4c0 1.76-1.43 3.19-3.19 3.19s-3.19-1.43-3.19-3.19 1.43-3.19 3.19-3.19 3.19 1.43 3.19 3.19z"/></svg>
        </a>
      </div>

      <div class="player">
        <div class="player-icon">♪</div>
        <div class="player-info">
          <div class="track-title">Bengier kurwy v3</div>
          <div class="track-time">0:04 / 5:02</div>
        </div>
        <div class="player-controls">
          <button class="ctrl-btn" aria-label="Previous">⏮</button>
          <button class="ctrl-btn play" aria-label="Play/Pause">▶</button>
          <button class="ctrl-btn" aria-label="Next">⏭</button>
        </div>
      </div>

      <div class="views">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <span id="viewCount">...</span> views
      </div>
    </div>
  </div>

  <button class="mute-btn" id="muteBtn" title="Video geluid" aria-label="Mute">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
  </button>

  <script>
    const DISCORD_ID = '799448812254396427';

    // Floating particles
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDuration = (8 + Math.random() * 12) + 's';
      p.style.animationDelay = (Math.random() * 8) + 's';
      p.style.width = p.style.height = (1 + Math.random() * 3) + 'px';
      particlesContainer.appendChild(p);
    }

    // Real view counter (CountAPI)
    async function updateViews() {
      const viewEl = document.getElementById('viewCount');
      try {
        // Unique key for this site
        const res = await fetch('https://api.counterapi.dev/v1/darkcyber-x3sm/views/up');
        const data = await res.json();
        if (data && typeof data.count === 'number') {
          viewEl.textContent = data.count.toLocaleString('nl-NL');
        } else {
          viewEl.textContent = '?';
        }
      } catch (e) {
        // Fallback if counter fails
        viewEl.textContent = '—';
      }
    }
    updateViews();

    // Discord status via Lanyard
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    function setStatus(status) {
      statusDot.className = 'status-dot ' + (status || 'offline');
      const labels = {
        online: 'online',
        idle: 'idle',
        dnd: 'do not disturb',
        offline: 'offline'
      };
      statusText.textContent = labels[status] || 'offline';
    }

    async function fetchDiscordStatus() {
      try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
        const json = await res.json();
        if (json.success && json.data) {
          setStatus(json.data.discord_status || 'offline');
        } else {
          setStatus('offline');
        }
      } catch (e) {
        setStatus('offline');
      }
    }

    // Initial fetch + refresh every 30 seconds
    fetchDiscordStatus();
    setInterval(fetchDiscordStatus, 30000);

    // Video autoplay helper
    const video = document.getElementById('bgVideo');
    video.play().catch(() => {});
    document.body.addEventListener('click', () => {
      if (video.paused) video.play();
    }, { once: true });
  </script>
</body>
</html>
