<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>darkcyber</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-overlay: rgba(0, 0, 0, 0.55);
      --card-bg: rgba(20, 20, 25, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f5f5f7;
      --text-secondary: #a1a1aa;
      --accent: #8b5cf6;
      --accent-soft: rgba(139, 92, 246, 0.25);
      --glow: 0 0 40px rgba(139, 92, 246, 0.15);
      --online: #22c55e;
      --idle: #eab308;
      --dnd: #ef4444;
      --offline: #6b7280;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #000;
      color: var(--text-primary);
    }

    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      filter: brightness(0.7) contrast(1.1);
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.4) 70%, rgba(0,0,0,0.75) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }

    .profile-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 2.5rem 2rem 2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: var(--glow), 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: fadeUp 0.8s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar-wrapper {
      position: relative;
      width: 96px;
      height: 96px;
      margin: 0 auto 1.25rem;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.2);
      background: #1a1a2e;
    }

    .status-dot {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 18px;
      height: 18px;
      background: var(--offline);
      border: 3px solid #1a1a1f;
      border-radius: 50%;
      transition: background 0.3s ease;
    }

    .status-dot.online { background: var(--online); box-shadow: 0 0 8px var(--online); }
    .status-dot.idle { background: var(--idle); box-shadow: 0 0 8px var(--idle); }
    .status-dot.dnd { background: var(--dnd); box-shadow: 0 0 8px var(--dnd); }
    .status-dot.offline { background: var(--offline); }

    .username {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.35rem;
      background: linear-gradient(135deg, #fff 0%, #d4d4d8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .bio {
      font-size: 0.95rem;
      color: var(--text-secondary);
      font-weight: 400;
      margin-bottom: 1.5rem;
      line-height: 1.4;
    }

    .tags {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
      flex-wrap: wrap;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .tag.mc {
      background: var(--accent-soft);
      border-color: rgba(139, 92, 246, 0.3);
      color: #c4b5fd;
    }

    .tag.status-text {
      text-transform: capitalize;
    }

    /* Discord servers */
    .servers {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .server-card {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 0.65rem 0.9rem;
      text-decoration: none;
      color: var(--text-primary);
      transition: all 0.25s ease;
      min-width: 150px;
      flex: 1;
      max-width: 190px;
    }

    .server-card:hover {
      background: rgba(88, 101, 242, 0.15);
      border-color: rgba(88, 101, 242, 0.4);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .server-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
      background: #5865F2;
    }

    .server-info {
      text-align: left;
      min-width: 0;
    }

    .server-name {
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .server-stats {
      font-size: 0.68rem;
      color: var(--text-secondary);
      margin-top: 0.15rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .server-stats .online-dot {
      width: 7px;
      height: 7px;
      background: #22c55e;
      border-radius: 50%;
      display: inline-block;
    }

    /* Belgian flag */
    .belgian-flag {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
    }

    .flag-emoji {
      font-size: 1.1rem;
      line-height: 1;
    }

    .player {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 0.9rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .player-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 0.9rem;
    }

    .player-info {
      flex: 1;
      min-width: 0;
      text-align: left;
    }

    .track-title {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-time {
      font-size: 0.7rem;
      color: var(--text-secondary);
      margin-top: 0.15rem;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 0.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
      font-size: 0.95rem;
    }

    .ctrl-btn:hover { color: var(--text-primary); }

    .ctrl-btn.play {
      width: 32px;
      height: 32px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      color: var(--text-primary);
    }

    .views {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }

    .mute-btn {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 10;
      width: 44px;
      height: 44px;
      background: rgba(20, 20, 25, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      font-size: 1.1rem;
    }

    .mute-btn:hover {
      background: rgba(40, 40, 50, 0.85);
      transform: scale(1.05);
    }

    .particle {
      position: fixed;
      background: rgba(255, 255, 255, 0.55);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      animation: float linear infinite;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
    }

    @keyframes float {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 0.7; }
      90% { opacity: 0.7; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* Hidden YouTube player */
    #yt-player {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .ctrl-btn.active {
      color: #a78bfa;
    }

    @media (max-width: 480px) {
      .profile-card {
        padding: 2rem 1.25rem 1.5rem;
        border-radius: 20px;
      }
      .username { font-size: 1.5rem; }
      .avatar-wrapper { width: 84px; height: 84px; }
    }
  </style>
</head>
<body>
  <video class="bg-video" autoplay muted loop playsinline id="bgVideo">
    <source src="bg.mp4" type="video/mp4" />
  </video>

  <div class="overlay"></div>
  <div id="particles"></div>

  <div class="container">
    <div class="profile-card">
      <div class="avatar-wrapper">
        <!-- GitHub avatar -->
        <img 
          class="avatar" 
          src="https://github.com/X3SM.png" 
          alt="Avatar"
          id="avatarImg"
        />
        <div class="status-dot offline" id="statusDot"></div>
      </div>

      <h1 class="username">darkcyber</h1>
      <p class="bio">Ahhhh, i want PS5</p>

      <div class="tags">
        <span class="tag mc">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          MC
        </span>
        <span class="tag status-text" id="statusText">offline</span>
      </div>

      <!-- Discord Servers -->
      <div class="servers">
        <!-- Server 1: Xmodz -->
        <a href="https://discord.gg/FBf3qtfAna" class="server-card" target="_blank" rel="noopener" title="Join Xmodz">
          <img 
            class="server-icon" 
            src="https://cdn.discordapp.com/icons/1260044615508295773/304460eb7aa148928ecc1c6ef69df863.png?size=64" 
            alt="Xmodz"
            onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'"
          />
          <div class="server-info">
            <div class="server-name">Xmodz</div>
            <div class="server-stats">
              <span class="online-dot"></span>
              <span id="server1-online">21</span> online · <span id="server1-members">487</span>
            </div>
          </div>
        </a>

        <!-- Server 2: Xmodz v.2 -->
        <a href="https://discord.gg/RwbBxyWf7Y" class="server-card" target="_blank" rel="noopener" title="Join Xmodz v.2">
          <img 
            class="server-icon" 
            src="https://cdn.discordapp.com/icons/1337098327082406015/d2b0fa5e895e8d5047ec02830845ad4b.png?size=64" 
            alt="Xmodz v.2"
            onerror="this.src='https://cdn.discordapp.com/embed/avatars/1.png'"
          />
          <div class="server-info">
            <div class="server-name">Xmodz v.2</div>
            <div class="server-stats">
              <span class="online-dot"></span>
              <span id="server2-online">8</span> online · <span id="server2-members">92</span>
            </div>
          </div>
        </a>
      </div>

      <!-- Belgian flag -->
      <div class="belgian-flag">
        <span class="flag-emoji">🇧🇪</span>
        <span>Belgium</span>
      </div>

      <div class="player">
        <div class="player-icon">♪</div>
        <div class="player-info">
          <div class="track-title" id="trackTitle">Loading...</div>
          <div class="track-time" id="trackTime">0:00 / 0:00</div>
        </div>
        <div class="player-controls">
          <button class="ctrl-btn" id="prevBtn" aria-label="Previous">⏮</button>
          <button class="ctrl-btn play" id="playBtn" aria-label="Play/Pause">▶</button>
          <button class="ctrl-btn" id="nextBtn" aria-label="Next">⏭</button>
        </div>
      </div>

      <!-- Hidden YouTube player -->
      <div id="yt-player"></div>

      <div class="views">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <span id="viewCount">...</span> views
      </div>
    </div>
  </div>

  <button class="mute-btn" id="muteBtn" title="Video geluid" aria-label="Mute">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
  </button>

  <script>
    const DISCORD_ID = '799448812254396427';

    // ===== Bigger floating particles =====
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 35; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDuration = (7 + Math.random() * 14) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      const size = 3 + Math.random() * 5; // bigger: 3px – 8px
      p.style.width = p.style.height = size + 'px';
      particlesContainer.appendChild(p);
    }

    // ===== View counter =====
    async function updateViews() {
      const viewEl = document.getElementById('viewCount');
      try {
        const res = await fetch('https://api.counterapi.dev/v1/darkcyber-x3sm/views/up');
        const data = await res.json();
        if (data && typeof data.count === 'number') {
          viewEl.textContent = data.count.toLocaleString('nl-NL');
        } else {
          viewEl.textContent = '?';
        }
      } catch (e) {
        viewEl.textContent = '—';
      }
    }
    updateViews();

    // ===== Discord server counts =====
    async function updateServerCounts() {
      try {
        const [res1, res2] = await Promise.all([
          fetch('https://discord.com/api/v9/invites/FBf3qtfAna?with_counts=true'),
          fetch('https://discord.com/api/v9/invites/RwbBxyWf7Y?with_counts=true')
        ]);
        const data1 = await res1.json();
        const data2 = await res2.json();

        if (data1.approximate_member_count) {
          document.getElementById('server1-members').textContent = data1.approximate_member_count.toLocaleString('nl-NL');
          document.getElementById('server1-online').textContent = data1.approximate_presence_count || 0;
        }
        if (data2.approximate_member_count) {
          document.getElementById('server2-members').textContent = data2.approximate_member_count.toLocaleString('nl-NL');
          document.getElementById('server2-online').textContent = data2.approximate_presence_count || 0;
        }
      } catch (e) {}
    }
    updateServerCounts();
    setInterval(updateServerCounts, 60000);

    // ===== Discord status (Lanyard) =====
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    function setStatus(status) {
      statusDot.className = 'status-dot ' + (status || 'offline');
      const labels = { online: 'online', idle: 'idle', dnd: 'do not disturb', offline: 'offline' };
      statusText.textContent = labels[status] || 'offline';
    }

    async function fetchDiscordStatus() {
      try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
        const json = await res.json();
        if (json.success && json.data) {
          setStatus(json.data.discord_status || 'offline');
        } else {
          setStatus('offline');
        }
      } catch (e) {
        setStatus('offline');
      }
    }
    fetchDiscordStatus();
    setInterval(fetchDiscordStatus, 30000);

    // ===== Background video =====
    const video = document.getElementById('bgVideo');
    video.play().catch(() => {});

    // ===== Music Player (YouTube IFrame API) =====
    const playlist = [
      {
        id: 'le3Y6rT8gxQ',
        title: 'Bengier kurwy v3',
        start: 30          // start at 0:30
      },
      {
        id: 'MsAhEYYga_c',
        title: 'Next Track',
        start: 0
      }
    ];

    let currentTrack = 0;
    let player = null;
    let isPlaying = false;
    let timeInterval = null;

    const trackTitleEl = document.getElementById('trackTitle');
    const trackTimeEl = document.getElementById('trackTime');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function formatTime(s) {
      s = Math.floor(s || 0);
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return m + ':' + (sec < 10 ? '0' : '') + sec;
    }

    function updateTimeDisplay() {
      if (!player || typeof player.getCurrentTime !== 'function') return;
      try {
        const cur = player.getCurrentTime();
        const dur = player.getDuration();
        trackTimeEl.textContent = formatTime(cur) + ' / ' + formatTime(dur);
      } catch (e) {}
    }

    function loadTrack(index, autoplay = true) {
      currentTrack = index;
      const track = playlist[currentTrack];
      trackTitleEl.textContent = track.title;

      if (player && typeof player.loadVideoById === 'function') {
        player.loadVideoById({
          videoId: track.id,
          startSeconds: track.start
        });
        if (autoplay) {
          player.playVideo();
          isPlaying = true;
          playBtn.textContent = '❚❚';
        }
      }
    }

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', {
        height: '1',
        width: '1',
        videoId: playlist[0].id,
        playerVars: {
          autoplay: 0,
          controls: 0,
          disablekb: 1,
          fs: 0,
          modestbranding: 1,
          rel: 0,
          start: playlist[0].start
        },
        events: {
          onReady: function (e) {
            // Try to start music (browsers often block until user interaction)
            try {
              e.target.seekTo(playlist[0].start);
              e.target.playVideo();
              isPlaying = true;
              playBtn.textContent = '❚❚';
              trackTitleEl.textContent = playlist[0].title;
            } catch (err) {}

            timeInterval = setInterval(updateTimeDisplay, 500);
          },
          onStateChange: function (e) {
            // ended
            if (e.data === YT.PlayerState.ENDED) {
              // go to next track
              const next = (currentTrack + 1) % playlist.length;
              loadTrack(next, true);
            }
            if (e.data === YT.PlayerState.PLAYING) {
              isPlaying = true;
              playBtn.textContent = '❚❚';
            }
            if (e.data === YT.PlayerState.PAUSED) {
              isPlaying = false;
              playBtn.textContent = '▶';
            }
          }
        }
      });
    }

    // Load YouTube IFrame API
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
    window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

    // Controls
    playBtn.addEventListener('click', () => {
      if (!player) return;
      if (isPlaying) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    });

    nextBtn.addEventListener('click', () => {
      const next = (currentTrack + 1) % playlist.length;
      loadTrack(next, true);
    });

    prevBtn.addEventListener('click', () => {
      const prev = (currentTrack - 1 + playlist.length) % playlist.length;
      loadTrack(prev, true);
    });

    // First click anywhere = unlock audio (browser autoplay policy)
    let audioUnlocked = false;
    document.body.addEventListener('click', () => {
      if (!audioUnlocked && player && typeof player.playVideo === 'function') {
        try {
          player.seekTo(playlist[currentTrack].start);
          player.playVideo();
          isPlaying = true;
          playBtn.textContent = '❚❚';
          audioUnlocked = true;
        } catch (e) {}
      }
      if (video.paused) video.play();
    }, { once: false });
  </script>
</body>
</html>
